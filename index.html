<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap"></noscript>
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF; --tint:#F4EFE4; --line:#E4DDCD;
  --gold:#9C7C33; --gold-soft:#C2A461; --gold-wash:rgba(156,124,51,.06);
  --ink:#2B2721; --mute:#8B8275;
  --ok:#5B8A6B; --warn:#B58432; --stop:#AF5A4C;
  --sans:'Noto Sans TC',system-ui,sans-serif; --serif:'Noto Serif TC',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%;max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft);
  box-shadow:0 0 0 3px var(--gold-wash)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:520px;margin:0 auto;
  padding-left:max(26px,env(safe-area-inset-left));
  padding-right:max(26px,env(safe-area-inset-right))}
.rule{height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent);opacity:.6}

header{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0 12px}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.16em;color:var(--gold);
  display:flex;align-items:center;gap:9px}
.brand img{width:21px;height:21px;display:block}
.lmark{width:40px;height:40px;display:block;margin:0 0 20px}
.who{font-size:11.5px;color:var(--mute);letter-spacing:.05em;text-align:right;line-height:1.35}
.who b{display:block;color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.02em}

.prog{padding:12px 0 14px}
.pnums{display:flex;gap:20px;align-items:baseline}
.pn{display:flex;align-items:baseline;gap:5px}
.pn i{font-style:normal;font-family:var(--serif);font-size:23px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}
.pn s{text-decoration:none;font-size:11px;color:var(--mute);letter-spacing:.1em}
.bar{height:3px;background:var(--line);margin-top:11px;border-radius:3px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));
  transition:width .5s cubic-bezier(.2,.8,.3,1)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;
  margin-left:calc(-1 * max(26px,env(safe-area-inset-left)));
  margin-right:calc(-1 * max(26px,env(safe-area-inset-right)));
  scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);
  font-size:12.5px;color:var(--mute);white-space:nowrap;transition:.18s}
.fc[aria-pressed=true]{border-color:var(--gold-soft);color:var(--gold);background:var(--gold-wash);font-weight:700}

.list{padding:2px 0 90px}
.mc{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:10px;transition:.18s;
  box-shadow:0 1px 2px rgba(43,39,33,.04)}
.mc:active{transform:scale(.988)}
.list.pending .mc{opacity:.55}
.rpbox{margin:4px 0 14px;padding:11px 13px;background:#FBF4E4;border:1px solid #D9C08A;
  border-left-width:3px;border-radius:9px;font-size:12.5px;line-height:1.85;color:#5C4A22}
.rpbox b{display:block;font-size:12px;color:#9C7C33;margin-bottom:3px}
.rpsep{height:1px;background:#E3D3AE;margin:9px 0}
.save.okbtn,.reread.okbtn{background:#2F7A5E;color:#fff;border-color:#2F7A5E}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;
  padding:13px 14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;font:inherit;color:var(--ink)}
.todo:active{transform:scale(.995)}
.todo.zero{opacity:.5;border-left-color:var(--line)}
.todo i{font-style:normal;font-size:22px;font-weight:600;color:var(--gold);min-width:34px;text-align:center}
.todo span{flex:1;font-size:12px;color:var(--mute);line-height:1.6}
.todo span b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:1px}
.todo s{text-decoration:none;font-size:11px;color:var(--gold);white-space:nowrap}
.todo.zero i,.todo.zero s{color:var(--mute)}
.dc.tapx{position:relative;padding-bottom:24px}
.dc.tapx:active{transform:scale(.995)}
.dc.tapx::after{content:'開啟／回覆 ›';position:absolute;right:12px;bottom:8px;
  font-size:10.5px;color:#9C7C33;letter-spacing:.03em}
.newdot{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;
  background:#9C7C33;color:#fff;font-size:10px;vertical-align:middle}
.loadbar{margin:10px 0 2px;padding:9px 12px;background:var(--tint);border:1px solid var(--line);
  border-radius:9px;font-size:12px;color:#6B6459;line-height:1.7}
.mc.done{border-left-color:var(--ok)}
.mc.blocked{border-left-color:var(--stop)}
.mc.intent{border-left-color:var(--gold)}
.mrow{display:flex;align-items:center;gap:9px}
.mname{font-size:16px;font-weight:700;letter-spacing:.02em}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.06em;font-weight:700;
  border:1px solid var(--line);color:var(--mute);background:var(--tint)}
.tag.A{color:#fff;border-color:var(--gold);background:var(--gold)}
.tag.B{color:var(--gold);border-color:var(--gold-soft);background:var(--gold-wash)}
.mstate{margin-left:auto;font-size:11.5px;letter-spacing:.04em;color:var(--mute)}
.mstate.ok{color:var(--ok)} .mstate.stop{color:var(--stop)} .mstate.gold{color:var(--gold);font-weight:700}
.mmeta{font-size:11.5px;color:var(--mute);margin-top:6px;letter-spacing:.02em}
.hook{margin-top:9px;padding:9px 11px;background:var(--tint);border-left:2px solid var(--gold-soft);
  border-radius:0 5px 5px 0;font-size:12.5px;line-height:1.55;color:#5C5348}
.hook b{color:var(--gold);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(43,39,33,.42);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-top:2px solid var(--gold-soft);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 32px rgba(43,39,33,.14);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  max-height:92vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;background:var(--line);border-radius:4px;margin:9px auto 0}
.sh{padding:14px 18px 0}
.sh h3{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:.03em}
.sh p{margin:0;font-size:12px;color:var(--mute)}
.sb{padding:16px 18px 0}
.fld{margin-bottom:15px}
.lb{font-size:11.5px;color:var(--mute);letter-spacing:.1em;margin-bottom:7px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--mute);
  background:var(--card);transition:.18s}
.seg button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:var(--gold-wash);font-weight:700}
.blocks{display:flex;flex-direction:column;gap:7px}
.blocks button{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  font-size:13.5px;color:var(--mute);display:flex;gap:10px;align-items:flex-start;transition:.18s}
.blocks button[aria-pressed=true]{border-color:var(--gold);color:var(--ink);background:var(--gold-wash)}
.blocks em{font-style:normal;font-size:11px;color:var(--mute);display:block;margin-top:2px}
.blocks button[aria-pressed=true] em{color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:7px;flex:0 0 auto}
.blocks button[aria-pressed=true] .dot{background:var(--gold)}
.save{width:100%;padding:15px;background:var(--gold);color:#FFF;font-weight:700;font-size:15px;
  border-radius:9px;letter-spacing:.06em;margin-top:4px}
.save:disabled{background:var(--line);color:var(--mute)}
.skip{width:100%;padding:12px;font-size:13px;color:var(--mute);margin-top:6px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:4px;
  overflow-x:auto;scrollbar-width:none;
  margin-left:calc(-1 * max(26px,env(safe-area-inset-left)));
  margin-right:calc(-1 * max(26px,env(safe-area-inset-right)));
  padding-left:max(26px,env(safe-area-inset-left));
  padding-right:max(26px,env(safe-area-inset-right))}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:13px 15px;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;letter-spacing:.05em}
.tabs button[aria-pressed=true]{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.tt{width:100%;border-collapse:collapse;margin-top:6px}
.tt th{font-size:10.5px;color:var(--mute);letter-spacing:.09em;font-weight:400;text-align:right;
  padding:9px 6px;border-bottom:1px solid var(--line)}
.tt th:first-child{text-align:left}
.tt td{padding:13px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;
  font-variant-numeric:tabular-nums}
.tt td:first-child{text-align:left;font-size:13.5px;letter-spacing:.04em;font-weight:700}
.tt td.g{color:var(--gold);font-family:var(--serif);font-weight:700}
.tt tr.blank td{color:#C9C1B2}
.sect{font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:var(--gold);
  margin:26px 0 10px;font-weight:700}
.bl{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.bl i{font-style:normal;font-family:var(--serif);font-size:17px;color:var(--gold);min-width:26px;
  font-variant-numeric:tabular-nums;font-weight:700}
.bl s{text-decoration:none;color:var(--mute);font-size:12px;margin-left:auto}
.note{font-size:11.5px;color:var(--mute);line-height:1.7;padding:14px 0 30px}

.login{padding-top:38px;padding-bottom:40px}
.login h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.08em;margin:0 0 8px;color:var(--gold);line-height:1.5}
.login p{font-size:13px;color:var(--mute);margin:0;line-height:1.75}
.ug{display:flex;flex-direction:column;gap:9px}
.ub{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;text-align:left;transition:.18s;
  box-shadow:0 1px 2px rgba(43,39,33,.04)}
.ub:active{transform:scale(.99)}
.ub b{font-weight:700;font-size:15px}
.ub s{text-decoration:none;font-size:11px;color:var(--mute);display:block;margin-top:2px}
.ub em{font-style:normal;margin-left:auto;font-family:var(--serif);font-size:19px;color:var(--gold);
  font-variant-numeric:tabular-nums;font-weight:700}
.ub em span{font-size:10px;color:var(--mute);font-family:var(--sans);margin-left:2px;font-weight:400}
.more{width:100%;padding:13px;font-size:12.5px;color:var(--gold);border:1px dashed var(--line);
  border-radius:9px;margin-top:10px;background:var(--card)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:var(--ink);
  color:var(--paper);padding:11px 22px;border-radius:99px;font-size:13.5px;font-weight:700;z-index:80;
  opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(43,39,33,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.loading{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-top:8px;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

.pc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(43,39,33,.04)}
.pc.warn{border-left-color:var(--warn)}
.pc.late{border-left-color:var(--stop)}
.pc.past{opacity:.5}
.ptopic{font-size:13px;color:#5C5348;margin-top:7px;line-height:1.55}
.pdue{font-size:11.5px;color:var(--mute);margin-top:7px}
.pdue.bad{color:var(--stop);font-weight:700}
.pchk{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.ck{padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--tint);
  font-size:12px;color:var(--mute);transition:.18s}
.ck[aria-pressed=true]{border-color:var(--gold);color:#fff;background:var(--gold);font-weight:700}
.pnote{margin-top:9px;font-size:14px}
.evdone{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.evdone span{font-size:11.5px;color:var(--ok);border:1px solid #CFE0D4;background:#F1F7F2;
  padding:3px 9px;border-radius:99px}
.ecat{font-size:11px;color:var(--gold);letter-spacing:.14em;margin:18px 0 7px;font-weight:700}
.ei{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:11px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;
  font-size:13.5px;line-height:1.5;transition:.18s}
.ei s{text-decoration:none;margin-left:auto;font-size:11px;color:var(--mute);white-space:nowrap;padding-top:2px}
.eidot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:6px;flex:0 0 auto}
.ei.s1 .eidot{background:var(--warn)} .ei.s1{border-color:#E8D5B0}
.ei.s2 .eidot{background:var(--ok)} .ei.s2{opacity:.6}
.ei.s2 span:nth-child(2){text-decoration:line-through;color:var(--mute)}

.lr{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.lg{font-size:15px;line-height:1}
.ln{font-size:14px;font-weight:700;letter-spacing:.04em;min-width:44px}
.lr s{text-decoration:none;margin-left:auto;font-size:12px;color:var(--mute);text-align:right}
.wf{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.wf input{flex:1 1 100%;font-size:14px;padding:10px 11px}
.wf input.short{flex:0 0 88px}
.wone{margin-bottom:7px;font-size:14px;padding:10px 11px}
textarea[data-w]{font-size:14px;line-height:1.6;resize:vertical}
.peekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  padding:10px 14px;margin-top:12px;background:rgba(201,169,97,.1);border:1px solid var(--gold-soft);
  border-radius:9px;font-size:11.5px;color:#5C5348}
.peekbar button{flex:0 0 auto;padding:6px 12px;background:var(--gold);color:#fff;border-radius:99px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.pn s.up{color:var(--ok)} .pn s.dn{color:var(--stop)}
.denom{font-size:11px;color:var(--mute);margin-top:9px;letter-spacing:.02em}
button.denom.sbjump{display:block;width:100%;text-align:left;padding:9px 11px;margin-top:10px;
  background:var(--tint);border:1px solid var(--line);border-radius:8px;color:#5C5348;line-height:1.6}
button.denom.sbjump:active{transform:scale(.99)}
.dc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  margin-bottom:9px;box-shadow:0 1px 2px rgba(43,39,33,.04)}
.note b{color:var(--stop);font-weight:700}
.sect2{font-family:var(--serif);font-size:11.5px;letter-spacing:.16em;color:var(--gold);
  margin:26px 0 10px;font-weight:700}
.login .sect2:first-of-type{margin-top:4px}
.offbar{margin-top:12px;padding:10px 13px;background:#FBEDE6;border:1px solid #D8A48A;
  border-radius:9px;font-size:12.5px;line-height:1.8;color:#8A4B2A}
.offbar b{display:block;font-size:13px;margin-bottom:2px}
.offwarn{margin:4px 0 12px;padding:11px 13px;background:#FBEDE6;border:1px solid #D8A48A;
  border-radius:9px;font-size:12.5px;line-height:1.8;color:#8A4B2A}
.offwarn b{display:block;font-size:13px;margin-bottom:3px}
.lockbox{margin-top:20px;padding:15px 16px;background:var(--tint);border:1px solid var(--line);
  border-radius:10px;font-size:12.5px;line-height:1.95;color:#5C5348}
.lockbox b{display:block;margin-bottom:6px;color:var(--gold);font-size:13px}
.lsearch{margin:12px 0 2px}
.lsearch input{width:100%;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:9px;outline:none;-webkit-appearance:none}
.lsearch input:focus{border-color:var(--gold)}
.batchnote{font-size:12px;color:var(--mute);line-height:1.75;padding:16px 14px;margin:4px 0 2px;
  background:var(--tint);border-radius:9px;border-left:2px solid var(--gold-soft)}
.reread{display:block;width:100%;padding:15px;font-size:12px;color:var(--mute);
  letter-spacing:.04em;margin-top:6px}
.intro{padding-top:66px;padding-bottom:40px;text-align:left}
.ilead{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.75;
  letter-spacing:.04em;color:var(--ink)}
.isub{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.8;
  letter-spacing:.04em;color:var(--gold);margin-top:14px}
.irule{height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent);margin:30px 0 22px;opacity:.7}
.ifine{font-size:13px;line-height:1.85;color:var(--mute);letter-spacing:.02em}
.empty{text-align:center;padding:52px 20px;color:var(--mute);font-size:13.5px;line-height:1.8}
</style>

<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

/* ===== 燈號 ===== */
function lights(){
  const p=pOf(ymNow());
  let L1='🟡',N1='尚未填入本月業績';
  if(p&&p.goal){
    const r=p.rev/p.goal, g=monthProg();
    L1 = r>=g*0.9?'🟢' : r>=g*0.7?'🟡' : '🔴';
    N1 = `達成 ${(r*100).toFixed(1)}%　月進度 ${(g*100).toFixed(1)}%`;
  }
  const tw=TEAMS.reduce((a,t)=>a+statWk(teamOf(t),curWk()).con,0);
  const conAll=stat(DATA.members).con;
  const L2 = tw>0?'🟢':(conAll>0?'🟡':'🔴');
  const N2 = tw>0?`本週新增 ${tw} 筆`:(conAll>0?'本週尚無新增紀錄':'尚未開始接觸');
  const all=PROJ.courses.concat([PROJ.sports]).filter(c=>daysTo(c.d)>=0)
    .sort((a,b)=>daysTo(a.d)-daysTo(b.d));
  let L3='🟢',N3='七堂已排定';
  if(all.length){const c=all[0],i=PROJ.courses.indexOf(c),
    k=(i>=0?'c'+i:'c'+PROJ.courses.length), s=proj[k]||{},
    dd=daysTo(dueDate(c.d,14));
    L3 = s.recv?'🟢':(dd<0?'🔴':dd<=7?'🟡':'🟢');
    N3 = `下一場 ${fmt(c.d)}　教材${s.recv?'已收到':(dd<0?'逾期 '+(-dd)+' 天':'剩 '+dd+' 天')}`;}
  let L4='🟢',N4='';
  const ev=PROJ.events.filter(e=>daysTo(e.d)>=0).sort((a,b)=>daysTo(a.d)-daysTo(b.d))[0];
  if(ev){const ei=PROJ.events.indexOf(ev);
    const tot=ev.items.length, done=ev.items.filter((x,ii)=>(proj['e'+ei+'_'+ii]||0)===2).length;
    const dt=daysTo(ev.d), pct=done/tot;
    L4 = dt<=14&&pct<0.8?'🔴' : dt<=30&&pct<0.5?'🟡' : '🟢';
    N4 = `${ev.name}　剩 ${dt} 天　前置 ${done}/${tot}`;}
  return [['業績',L1,N1],['喚醒',L2,N2],['活動',L4,N4],['教育',L3,N3]];
}

function cupRows(scope){
  const ups=DATA.uplines.filter(u=>!scope||u.t===scope);
  const rows=ups.map(u=>{
    const ms=DATA.members.filter(m=>m.u===u.n);
    return {n:u.n,t:u.t,lv:u.lv,den:wakeDenP(ms),ord:wakeOrdP(ms)};
  });
  rows.forEach(r=>{ r.pay=tier(r.ord); });
  // 各隊第一名 ×1.5：必須先達到第一階（3 人）才算，同分並列
  const bestOrd={};
  rows.forEach(r=>{ if(r.ord>bestOrd[r.t]||bestOrd[r.t]===undefined) bestOrd[r.t]=r.ord; });
  rows.forEach(r=>{ if(tier(r.ord)>0&&r.ord===bestOrd[r.t]){ r.top=true; r.pay=Math.round(tier(r.ord)*1.5); } });
  // 全體第一 10,000：同樣要達到第一階，與階梯二擇一取高，不累加
  const allOrd=DATA.uplines.map(u=>wakeOrdP(DATA.members.filter(m=>m.u===u.n)));
  const champOrd=Math.max(0,...allOrd);
  rows.forEach(r=>{ if(champOrd>=3&&r.ord===champOrd){ r.champ=true; r.pay=Math.max(r.pay,10000); } });
  rows.sort((a,b)=>b.ord-a.ord||b.den-a.den);
  return rows;
}

function detailBlock(ms,who){
  if(dfilter==='out'&&who!=='dept') dfilter='all';   // 名單外只有經銷部有，切身分時自動回到全部
  const rec=ms.filter(m=>logOf(m));
  const myRp=m=>{const l=logOf(m); return ((who==='dept'?(l.rpd||''):(l.rpl||'')).trim())!=='';};
  const nrp=rec.filter(m=>who==='dept'?isNewLeaderRp(m,logOf(m)):isNewRp(m,logOf(m))).length;
  const nmine=rec.filter(myRp).length, nnone=rec.length-nmine;
  const D=[['all','全部 '+rec.length]]
    .concat(who==='dept'&&OUT.length?[['out','名單外 '+OUT.length]]:[])
    .concat(nrp?[['rp','新回覆 '+nrp]]:[])
    .concat([['mine','我回過 '+nmine],['norp','還沒回 '+nnone]])
    .concat([['sb','已給 SB '+rec.filter(m=>logOf(m).sb>0).length],
           ['ord','已下單 '+rec.filter(m=>logOf(m).ord).length],['block','有卡點'],['noreply','無回應']]);
  let show=rec.filter(m=>{const l=logOf(m);
    return dfilter==='all'?true
      :dfilter==='out'?false
      :dfilter==='rp'?(who==='dept'?isNewLeaderRp(m,l):isNewRp(m,l))
      :dfilter==='mine'?myRp(m)
      :dfilter==='norp'?!myRp(m)
      :dfilter==='sb'?l.sb>0:dfilter==='ord'?!!l.ord
      :dfilter==='block'?(l.block&&l.block!=='ok'):!l.reply;});
  show.sort(dfilter==='sb'
    ?(a,b)=>(logOf(b).sb||0)-(logOf(a).sb||0)||(logOf(b).amt||0)-(logOf(a).amt||0)
    :(a,b)=>((logOf(b).ord?1:0)-(logOf(a).ord?1:0))||(logOf(b).amt||0)-(logOf(a).amt||0)||logOf(b).ts-logOf(a).ts);
  if(dfilter==='out') return `
  <div class="filters">${D.map(([k,t])=>`<button class="fc" data-d="${k}" aria-pressed="${dfilter===k}">${t}</button>`).join('')}</div>
  ${outBlock(OUT,false)}`;
  return `
  <div class="filters">${D.map(([k,t])=>`<button class="fc" data-d="${k}" aria-pressed="${dfilter===k}">${t}</button>`).join('')}</div>
  ${show.length?show.map(m=>{const l=logOf(m);
    return `<div class="dc${canReply()?' tapx':''}" ${canReply()?`data-key="${esc(keyOf(m))}"`:''}>
      <div class="mrow"><span class="mname">${esc(m.n)}</span>
        <span class="tag ${m.g}">${m.g}</span>
        <span class="mstate ${l.ord?'gold':(l.reply?'ok':'')}">${l.ord?('已下單'+(l.amt?' '+money(l.amt):'')):(l.reply?'有回應':'無回應')}</span></div>
      <div class="mmeta">${esc(m.u)} → ${esc(m.n)}　·　${dstr(l.d)}${who==='dept'?'　·　'+m.t:''}${l.sb?'　·　SB '+l.sb+' 盒':''}</div>
      ${l.sb?`<div class="hook"><b>SB ${l.sb} 盒</b>　${l.ord?'後續已下單'+(l.amt?' '+money(l.amt):''):'後續尚未下單'}</div>`:''}
      ${rpHtml(m,l,'8px 0 0')}
      ${l.block&&l.block!=='ok'?`<div class="hook"><b>${esc(BMAP[l.block])}</b>${(l.note||'').trim()?'　'+esc(l.note):'　<span style="color:#A8A093">沒寫備註</span>'}</div>`
        :((l.note||'').trim()?`<div class="hook">${esc(l.note)}</div>`:'')}
    </div>`}).join(''):`<div class="empty">${dfilter==='sb'?'還沒有人被記錄拿到 SB。':'尚無紀錄。'}</div>`}
  ${rec.length?`<button class="more" id="exp">複製成表格（貼進 Excel）</button>`:''}
  <p class="note">明細僅供備查。<b>不要在群組引用單筆內容</b> — 一旦上線看到自己填的話被公開，下一週就沒人認真填了。<br>
  需要處理個案時私下問「這批你這邊狀況怎麼樣」，不要說「我看到你寫」。</p>`;
}

const TKEY='morebeaut-wake-token';
function readToken(){
  // 1) ?u=xxx
  let q=new URLSearchParams(location.search).get('u');
  // 2) #u=xxx 或 #xxx（GitHub Pages 重導會吃掉 ?，但不會吃掉 #）
  if(!q&&location.hash){
    const h=location.hash.replace(/^#/,'');
    q=h.indexOf('u=')===0?h.slice(2):h;
  }
  if(q&&TOKENS[q]){
    try{localStorage.setItem(TKEY,q);}catch(e){}
    return q;
  }
  // 3) 這台裝置上次成功開啟的代碼（網址被重導洗掉時的救援）
  try{const s=localStorage.getItem(TKEY); if(s&&TOKENS[s]) return s;}catch(e){}
  return null;
}
function hasToken(){return !!readToken();}
function boot(){
  const q=readToken();
  if(q&&TOKENS[q]){
    const v=TOKENS[q];
    role = v.type==='upline'?{type:'upline',name:v.name}
         : v.type==='leader'?{type:'leader',team:v.team}:{type:'dept'};
    if(role.type==='leader'){tab='self';} if(role.type==='dept'){tab='rank';}
  }
  loadPending(); loadRead();
  render();
  Promise.all([loadRetry(),loadSeen(),loadProj()]).then(async()=>{ loading=false;
    applyPending(); render();
    if(online){ await flush(); render(); }
    else toast('連不上資料庫，填的內容會先存在手機裡'); });
  // 從背景切回前景、或網路恢復時，自動重抓一次
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) revive(); });
  window.addEventListener('online',revive);
  window.addEventListener('focus',revive);
}
async function loadRetry(){
  const waits=[0,1500,4000];
  for(let i=0;i<waits.length;i++){
    if(waits[i]) await new Promise(r=>setTimeout(r,waits[i]));
    await load();
    if(online) return;
  }
}
async function revive(){
  if(online||reviving||loading) return;
  reviving=true;
  try{
    await load();
    if(online){ await flush(); render(); toast('連線已恢復'); }
  } finally { reviving=false; }
}
boot();
</script>
