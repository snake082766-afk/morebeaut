<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF; --tint:#F4EFE4; --line:#E4DDCD;
  --gold:#9C7C33; --gold-soft:#C2A461; --gold-wash:rgba(156,124,51,.06);
  --ink:#2B2721; --mute:#8B8275;
  --ok:#5B8A6B; --warn:#B58432; --stop:#AF5A4C;
  --sans:'Noto Sans TC',system-ui,sans-serif; --serif:'Noto Serif TC',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft);
  box-shadow:0 0 0 3px var(--gold-wash)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent);opacity:.6}

header{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0 12px}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.16em;color:var(--gold);
  display:flex;align-items:center;gap:9px}
.brand img{width:21px;height:21px;display:block}
.lmark{width:46px;height:46px;display:block;margin:0 0 18px}
.who{font-size:11.5px;color:var(--mute);letter-spacing:.05em;text-align:right;line-height:1.35}
.who b{display:block;color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.02em}

.prog{padding:12px 0 14px}
.pnums{display:flex;gap:20px;align-items:baseline}
.pn{display:flex;align-items:baseline;gap:5px}
.pn i{font-style:normal;font-family:var(--serif);font-size:23px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}
.pn s{text-decoration:none;font-size:11px;color:var(--mute);letter-spacing:.1em}
.bar{height:3px;background:var(--line);margin-top:11px;border-radius:3px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));
  transition:width .5s cubic-bezier(.2,.8,.3,1)}

.filters{display:flex;gap:7px;overflow-x:auto;padding:11px 16px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);
  font-size:12.5px;color:var(--mute);white-space:nowrap;transition:.18s}
.fc[aria-pressed=true]{border-color:var(--gold-soft);color:var(--gold);background:var(--gold-wash);font-weight:700}

.list{padding:2px 0 90px}
.mc{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;transition:.18s;
  box-shadow:0 1px 2px rgba(43,39,33,.04)}
.mc:active{transform:scale(.988)}
.mc.done{border-left-color:var(--ok)}
.mc.blocked{border-left-color:var(--stop)}
.mc.intent{border-left-color:var(--gold)}
.mrow{display:flex;align-items:center;gap:9px}
.mname{font-size:16px;font-weight:700;letter-spacing:.02em}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.06em;font-weight:700;
  border:1px solid var(--line);color:var(--mute);background:var(--tint)}
.tag.A{color:#fff;border-color:var(--gold);background:var(--gold)}
.tag.B{color:var(--gold);border-color:var(--gold-soft);background:var(--gold-wash)}
.mstate{margin-left:auto;font-size:11.5px;letter-spacing:.04em;color:var(--mute)}
.mstate.ok{color:var(--ok)} .mstate.stop{color:var(--stop)} .mstate.gold{color:var(--gold);font-weight:700}
.mmeta{font-size:11.5px;color:var(--mute);margin-top:6px;letter-spacing:.02em}
.hook{margin-top:9px;padding:9px 11px;background:var(--tint);border-left:2px solid var(--gold-soft);
  border-radius:0 5px 5px 0;font-size:12.5px;line-height:1.55;color:#5C5348}
.hook b{color:var(--gold);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(43,39,33,.42);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-top:2px solid var(--gold-soft);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 32px rgba(43,39,33,.14);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  max-height:92vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;background:var(--line);border-radius:4px;margin:9px auto 0}
.sh{padding:14px 18px 0}
.sh h3{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:.03em}
.sh p{margin:0;font-size:12px;color:var(--mute)}
.sb{padding:16px 18px 0}
.fld{margin-bottom:15px}
.lb{font-size:11.5px;color:var(--mute);letter-spacing:.1em;margin-bottom:7px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--mute);

.seg button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:var(--gold-wash);font-weight:700}
.blocks{display:flex;flex-direction:column;gap:7px}
.blocks button{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  font-size:13.5px;color:var(--mute);display:flex;gap:10px;align-items:flex-start;transition:.18s}
.blocks button[aria-pressed=true]{border-color:var(--gold);color:var(--ink);background:var(--gold-wash)}
.blocks em{font-style:normal;font-size:11px;color:var(--mute);display:block;margin-top:2px}
.blocks button[aria-pressed=true] em{color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:7px;flex:0 0 auto}
.blocks button[aria-pressed=true] .dot{background:var(--gold)}
.save{width:100%;padding:15px;background:var(--gold);color:#FFF;font-weight:700;font-size:15px;

.save:disabled{background:var(--line);color:var(--mute)}
.skip{width:100%;padding:12px;font-size:13px;color:var(--mute);margin-top:6px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs button{flex:1;padding:13px 0;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;letter-spacing:.05em}
.tabs button[aria-pressed=true]{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.tt{width:100%;border-collapse:collapse;margin-top:6px}
.tt th{font-size:10.5px;color:var(--mute);letter-spacing:.09em;font-weight:400;text-align:right;

.ub em{font-style:normal;margin-left:auto;font-family:var(--serif);font-size:19px;color:var(--gold);

.ub em span{font-size:10px;color:var(--mute);font-family:var(--sans);margin-left:2px;font-weight:400}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:var(--ink);

.pchk{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}

.evdone{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.evdone span{font-size:11.5px;color:var(--ok);border:1px solid #CFE0D4;background:#F1F7F2;

.ei{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:11px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;

.empty{text-align:center;padding:52px 20px;color:var(--mute);font-size:13.5px;line-height:1.8}
</style>

/* ---------- 週次：由接觸日推算，不需另存快照 ---------- */
function wk(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const y=t.getUTCFullYear();
  return y+'-W'+String(Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7)).padStart(2,'0');
}
const curWk=()=>wk(new Date());
function prevWk(){const d=new Date();d.setDate(d.getDate()-7);return wk(d);}
function wkOf(l){ if(!l||!l.d) return ''; const p=String(l.d).split('-');
  return p.length<3?'':wk(new Date(+p[0],+p[1]-1,+p[2])); }
function statWk(ms,key){
  const ls=ms.map(logOf).filter(l=>l&&wkOf(l)===key);
  return {con:ls.length,rep:ls.filter(l=>l.reply).length,amt:ls.reduce((s,l)=>s+(l.amt||0),0)};
}
/* ---------- 日期 ---------- */
const WD='一二三四五六日';
function daysTo(s){const p=s.split('-');const t=new Date(+p[0],+p[1]-1,+p[2]);
  const n=new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);}
function fmt(s){const p=s.split('-');const t=new Date(+p[0],+p[1]-1,+p[2]);
  return (+p[1])+'/'+(+p[2])+'（'+WD[t.getDay()===0?6:t.getDay()-1]+'）';}
function dueDate(s,back){const p=s.split('-');const t=new Date(+p[0],+p[1]-1,+p[2]);
  t.setDate(t.getDate()-back);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}

function stateOf(m){
  const l=logOf(m); if(!l) return 'todo';
  if(l.amt>0) return 'intent';
  if(l.block&&l.block!=='ok'&&l.block!=='noreply') return 'blocked';
  if(l.reply) return 'replied';
  return 'contacted';
}
const STATE={todo:['未接觸',''],contacted:['已接觸',''],replied:['有回應','ok'],
             intent:['有意向','gold'],blocked:['有卡點','stop']};
function hookOf(m){
  if(m.g==='A') return ['檔期主力','確認這一檔的規格與金額，不用重新說明品牌。'];
  if(m.g==='B') return ['手上可能還有貨','<b>不是要他再進貨</b>，是公關品幫他把上次那批賣動。'];
  if(m.g==='C') return ['有下線','先讓他本人動起來，他底下的人才會跟著動。'];
  if(m.p) return ['指名回購',`「你上次買的<b>${esc(m.p)}</b>，這個月回購有優惠，要幫你留嗎？」`];
  return ['指名回購','用他上次買的品項開場，不要談品牌方向。'];
}
function stat(ms){
  const ls=ms.map(logOf).filter(Boolean);
  return {con:ls.length,rep:ls.filter(l=>l.reply).length,amt:ls.reduce((s,l)=>s+(l.amt||0),0)};
}
const wan=v=>v?(v/10000).toFixed(1):'0';
function delta(now,was){
  if(was==null) return '';
  const d=now-was;
  if(d===0) return `<s>持平</s>`;
  return `<s class="${d>0?'up':'dn'}">${d>0?'↑':'↓'}${Math.abs(d)}</s>`;
}

function card(m){
  const st=stateOf(m),[lbl,cls]=STATE[st],l=logOf(m),[tag,line]=hookOf(m);
  const cc=st==='intent'?'intent':st==='blocked'?'blocked':(st!=='todo'?'done':'');

    <div class="mrow"><span class="mname">${esc(m.n)}</span>
      <span class="tag ${m.g}">${m.g}</span>
      <span class="mstate ${cls}">${lbl}${l&&l.amt?'　'+wan(l.amt)+'萬':''}</span></div>
    <div class="mmeta">最後下單 ${m.ld||'無紀錄'}${m.sm!=null?`　停 ${m.sm} 個月`:''}</div>
    ${st==='todo'?`<div class="hook"><b>${tag}</b>　${line}</div>`
      :(l&&l.block&&l.block!=='ok'?`<div class="hook"><b>卡點</b>　${esc(BMAP[l.block])}${l.note?'：'+esc(l.note):''}</div>`:'')}
  </button>`;
}

    <div class="prog"><div class="pnums">
      <div class="pn"><i>${tw.con}</i><s>本週接觸 ${delta(tw.con,lw.con)}</s></div>
      <div class="pn"><i>${tw.rep}</i><s>本週回應 ${delta(tw.rep,lw.rep)}</s></div>
      <div class="pn"><i>${wan(tw.amt)}</i><s>本週意向萬</s></div>
    </div><div class="bar"><div style="width:${pct}%"></div></div>
    <div class="denom">累計已接觸 ${s.con} / 可覆蓋 ${info.cover} 人　·　名單共 ${info.list} 人　·　${curWk()}</div></div>
    <div class="tabs">${TAB.map(([k,t])=>`<button data-t="${k}" aria-pressed="${tab===k}">${t}</button>`).join('')}</div>
    ${tab==='self'?selfBlock(T,s,tw,lw,info)
     :tab==='detail'?detailBlock(ms,'leader')
     :blockBlock(ms)}
  </div>`;
  bindSw();
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  bindDetail();
}
function selfBlock(T,s,tw,lw,info){
  const ms=teamOf(T);
  const byUp=DATA.uplines.filter(u=>u.t===T).map(u=>{
    const um=ms.filter(m=>m.u===u.n); return {u,...stat(um),total:um.length};
  }).sort((a,b)=>(a.con/a.total)-(b.con/b.total));
  return `
  <table class="tt"><thead><tr><th></th><th>上週</th><th>本週</th></tr></thead><tbody>
    <tr><td>接觸</td><td>${lw.con||'—'}</td><td class="g">${tw.con}</td></tr>
    <tr><td>有回應</td><td>${lw.rep||'—'}</td><td class="g">${tw.rep}</td></tr>
    <tr><td>意向（萬）</td><td>${lw.amt?wan(lw.amt):'—'}</td><td class="g">${wan(tw.amt)}</td></tr>
  </tbody></table>
  <div class="sect">你隊上線的進度　·　由低到高</div>
  ${byUp.map(x=>`<div class="bl"><i>${x.con}/${x.total}</i><span>${esc(x.u.n)}</span>
    <s>${x.amt?wan(x.amt)+'萬':'—'}</s></div>`).join('')}
  <p class="note">比較對象是自己的上週，不是別隊。四隊名單規模與活躍上線數差異很大，橫向比不具意義。<br>
  分母用「可覆蓋人數」，因為沉睡上線那幾條線不在你這一層處理。</p>`;
}

/* ===== 經銷部端 ===== */
function renderDept(){
  const all=DATA.members, s=stat(all);
  const rows=TEAMS.map(t=>{
    const ms2=teamOf(t);
    return {t,info:DATA.teams[t],...stat(ms2),tw:statWk(ms2,curWk())};
  });
  const TAB=[['rank','喚醒'],['block','卡點'],['detail','明細'],['silent','未動'],['edu','教育'],['ev','活動']];
  const silent=DATA.uplines.filter(u=>!DATA.members.some(m=>m.u===u.n&&logOf(m)));
  $('#app').innerHTML=bar('經銷部彙總','經銷部')+`
  <div class="wrap">
    <div class="prog"><div class="pnums">
      <div class="pn"><i>${s.con}</i><s>已接觸 / 317</s></div>
      <div class="pn"><i>${s.rep}</i><s>有回應</s></div>
      <div class="pn"><i>${wan(s.amt)}</i><s>意向萬元</s></div>
    </div><div class="bar"><div style="width:${s.con/317*100}%"></div></div>
    <div class="denom">${curWk()}　·　本週新增 ${TEAMS.reduce((a,t)=>a+statWk(teamOf(t),curWk()).con,0)} 筆　·　僅你看得到四隊並排</div></div>
    <div class="tabs">${TAB.map(([k,t])=>`<button data-t="${k}" aria-pressed="${tab===k}">${t}</button>`).join('')}</div>
    ${tab==='rank'?`
      <table class="tt"><thead><tr><th>團隊</th><th>累計／可覆蓋</th><th>本週</th><th>意向（萬）</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.con?'':'blank'}"><td>${r.t}</td>
        <td>${r.con} / ${r.info.cover}</td><td>${r.tw.con||'—'}</td>
        <td class="g">${r.amt?wan(r.amt):'—'}</td></tr>`).join('')}
      </tbody></table>
      <div class="sect">結構差異　·　解讀基準</div>
      <table class="tt"><thead><tr><th>團隊</th><th>名單</th><th>活躍上線</th><th>每位負荷</th><th>A組</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.t}</td><td>${r.info.list}</td><td>${r.info.up}</td>
        <td>${(r.info.cover/r.info.up).toFixed(1)}</td><td class="g">${r.info.A}</td></tr>`).join('')}
      </tbody></table>
      <p class="note">TOP 名單是 THE ONE 的三倍、每位上線扛 8.6 人；RICH 只有 4 位 A 組。<br>
      四隊不可橫向比較 — 團隊長端只看得到自己隊與自己的上週。<br>
      這張表就是每週主管一頁式的數字來源。</p>`
     :tab==='block'?blockBlock(all)
     :tab==='detail'?detailBlock(all,'dept')
     :tab==='edu'?eduBlock()
     :tab==='ev'?evBlock()
     :`<div class="sect">本期尚無任何紀錄的上線</div>
       ${silent.length?silent.map(u=>`<div class="bl"><i>${u.c}</i><span>${esc(u.n)}</span><s>${u.t}</s></div>`).join('')
         :`<div class="empty">52 位上線都已有紀錄。</div>`}
       <p class="note">每週只找一隊。挑回應率最低或未動人數最多的那一隊主動問一次，四週輪完。</p>`}
  </div>`;
  bindSw();
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  bindDetail();
}


/* ===== 專案三：教育 ===== */
function eduBlock(){
  const all=PROJ.courses.concat([PROJ.sports]);
  const nxt=all.filter(c=>daysTo(c.d)>=0).sort((a,b)=>daysTo(a.d)-daysTo(b.d))[0];
  return `
  <div class="sect">課程與運動會　·　共 ${all.length} 場</div>
  <p class="note" style="padding:0 0 14px">課程由核心組規劃與主辦。你負責跟課、教材審核、場地與講師協助。<br>
  <b>教材為上課前 14 天送審。</b>未收到即為黃燈。${nxt?`下一場：${fmt(nxt.d)} ${nxt.host}`:''}</p>
  ${all.map((c,i)=>{
    const k='c'+i, s=proj[k]||{};
    const dt=daysTo(c.d), due=dueDate(c.d,14), dd=daysTo(due);
    const late=!s.recv&&dd<0&&dt>=0;
    const warn=!s.recv&&dd>=0&&dd<=7&&dt>=0;
    return `<div class="pc ${dt<0?'past':(late?'late':(warn?'warn':''))}">
      <div class="mrow">
        <span class="mname">${fmt(c.d)}</span>
        <span class="tag ${c.axis==='團隊'?'A':'B'}">${c.mode}</span>
        <span class="mstate">${c.host}　${c.axis}</span>
        <span class="mstate ${dt<0?'':'gold'}" style="margin-left:auto">${dt<0?'已過':'剩 '+dt+' 天'}</span>
      </div>
      <div class="ptopic">${c.topic}</div>
      ${dt>=0?`<div class="pdue ${late?'bad':''}">教材送審 ${fmt(due)}${s.recv?'　·　已收到':(dd<0?'　·　已逾期 '+(-dd)+' 天':'　·　還有 '+dd+' 天')}</div>`:''}
      <div class="pchk">
        ${[['recv','教材已送我'],['rev','我已審'],['help','需我協助'],['go','我要到場']].map(([f,t])=>
          `<button class="ck" data-p="${k}" data-f="${f}" aria-pressed="${!!s[f]}">${t}</button>`).join('')}
      </div>
      ${s.help?`<input class="pnote" data-p="${k}" data-f="hnote" placeholder="要協助什麼（場地／講師／其他）" value="${esc(s.hnote||'')}">`:''}
    </div>`}).join('')}`;
}

/* ===== 專案二：活動 ===== */
function evBlock(){
  return PROJ.events.map((e,ei)=>{
    const dt=daysTo(e.d);
    const items=e.items.map((x,ii)=>({cat:x[0],name:x[1],k:'e'+ei+'_'+ii}));
    const doneN=items.filter(x=>(proj[x.k]||0)===2).length;
    const cats=[...new Set(items.map(x=>x.cat))];
    return `
    <div class="sect">${e.name}　·　剩 ${dt} 天</div>
    <div class="evdone">${e.done.map(d=>`<span>✓ ${d}</span>`).join('')}</div>
    <div class="bar" style="margin:12px 0 4px"><div style="width:${doneN/items.length*100}%"></div></div>
    <div class="denom">已完成 ${doneN} / ${items.length} 項</div>
    ${cats.map(c=>`<div class="ecat">${c}</div>
      ${items.filter(x=>x.cat===c).map(x=>{const st=proj[x.k]||0;
        return `<button class="ei s${st}" data-e="${x.k}">
          <span class="eidot"></span><span>${x.name}</span><s>${CST[st]}</s></button>`}).join('')}`).join('')}`;
  }).join('')+`<p class="note">點一下切換：未開始 → 進行中 → 完成。<br>
  9/23 最該先定的是流程表與頒獎名單，其他項目都要等它。<br>
  12/18 最該先問的是「年會要承載什麼訊息」，以及年度影片要提前 6–8 週。</p>`;
}

/* ===== 卡點 ===== */
function blockBlock(ms){
  const bl={};
  ms.forEach(m=>{const l=logOf(m); if(l&&l.block&&l.block!=='ok') bl[l.block]=(bl[l.block]||0)+1;});
  const list=Object.entries(bl).sort((a,b)=>b[1]-a[1]);
  return `<div class="sect">卡點分布　·　誰能解</div>
    ${list.length?list.map(([k,v])=>`<div class="bl"><i>${v}</i><span>${esc(BMAP[k])}</span>
      <s>${OWNER[k]||''}</s></div>`).join(''):`<div class="empty">還沒有卡點紀錄。</div>`}
    <p class="note">同樣是落後，四種卡點的處置完全不同。<br>
    「接觸了但沒回應」是話術問題；「方案不夠」與「儲值卡住」要往上報，這一層出手沒有用。</p>`;
}

/* ===== 明細 ===== */
function detailBlock(ms,who){
  const rec=ms.filter(m=>logOf(m));
  const D=[['all','全部 '+rec.length],['intent','有意向'],['block','有卡點'],['noreply','無回應']];
  let show=rec.filter(m=>{const l=logOf(m);
    return dfilter==='all'?true:dfilter==='intent'?l.amt>0
      :dfilter==='block'?(l.block&&l.block!=='ok'):!l.reply;});
  show.sort((a,b)=>(logOf(b).amt||0)-(logOf(a).amt||0)||logOf(b).ts-logOf(a).ts);
  return `
  <div class="filters">${D.map(([k,t])=>`<button class="fc" data-d="${k}" aria-pressed="${dfilter===k}">${t}</button>`).join('')}</div>
  ${show.length?show.map(m=>{const l=logOf(m);
    return `<div class="dc">
      <div class="mrow"><span class="mname">${esc(m.n)}</span>
        <span class="tag ${m.g}">${m.g}</span>
        <span class="mstate ${l.amt?'gold':(l.reply?'ok':'')}">${l.amt?wan(l.amt)+'萬':(l.reply?'有回應':'無回應')}</span></div>
      <div class="mmeta">${esc(m.u)} → ${esc(m.n)}　·　${l.d}${who==='dept'?'　·　'+m.t:''}</div>
      ${l.block&&l.block!=='ok'?`<div class="hook"><b>${esc(BMAP[l.block])}</b>${l.note?'　'+esc(l.note):''}</div>`:''}
    </div>`}).join(''):`<div class="empty">尚無紀錄。</div>`}
  ${rec.length?`<button class="more" id="exp">複製成表格（貼進 Excel）</button>`:''}
  <p class="note">明細僅供備查。<b>不要在群組引用單筆內容</b> — 一旦上線看到自己填的話被公開，下一週就沒人認真填了。<br>
  需要處理個案時私下問「這批你這邊狀況怎麼樣」，不要說「我看到你寫」。</p>`;
}
function bindProj(){
  document.querySelectorAll('.ck').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.p,f=b.dataset.f;
    proj[k]=proj[k]||{}; proj[k][f]=!proj[k][f];
    await saveProj(); render();});
  document.querySelectorAll('.pnote').forEach(el=>el.onchange=async()=>{
    const k=el.dataset.p; proj[k]=proj[k]||{}; proj[k][el.dataset.f]=el.value;
    await saveProj();});
  document.querySelectorAll('.ei').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.e; proj[k]=((proj[k]||0)+1)%3;
    await saveProj(); render();});
}
function bindDetail(){
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dfilter=b.dataset.d;render()});
  const e=$('#exp'); if(e) e.onclick=doExport;
}
function doExport(){
  const ms=(role.type==='leader'?teamOf(role.team):DATA.members).filter(m=>logOf(m));
  const rows=[['團隊','上線','下線','分組','接觸日','有回應','意向金額','卡點','補充']];
  ms.forEach(m=>{const l=logOf(m);
    rows.push([m.t,m.u,m.n,m.g+'｜'+m.gn,l.d,l.reply?'有':'無',l.amt||0,BMAP[l.block]||'',l.note||'']);});
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>toast('已複製 '+ms.length+' 筆'),()=>toast('複製失敗'));
}

/* ===== 記錄表單 ===== */
function openSheet(name){
  editing=mine().find(m=>m.n===name);
  const l=logOf(editing);
  draft=l?{...l}:{d:today(),reply:null,amt:'',block:null,note:''};
  drawSheet(); $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');editing=null;}
function today(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function drawSheet(){
  const m=editing; if(!m) return;
  const ready=draft.block!==null&&draft.reply!==null;
  $('#sheet').innerHTML=`
    <div class="grab"></div>
    <div class="sh"><h3>${esc(m.n)}</h3>
      <p>${m.gn}　·　最後買 ${esc(m.p||'無紀錄')}</p></div>
    <div class="sb">
      <div class="fld"><label class="lb" for="dt">接觸日期</label>
        <input type="date" id="dt" value="${draft.d}"></div>
      <div class="fld"><span class="lb">對方有回應嗎</span><div class="seg">
        <button data-r="0" aria-pressed="${draft.reply===false}">沒有回應</button>
        <button data-r="1" aria-pressed="${draft.reply===true}">有回應</button></div></div>
      <div class="fld"><label class="lb" for="am">意向金額（沒有就留空）</label>
        <input type="number" id="am" inputmode="numeric" placeholder="0" value="${draft.amt||''}"></div>
      <div class="fld"><span class="lb">卡點　·　必選</span><div class="blocks">${BLOCKS.map(b=>`
        <button data-b="${b.k}" aria-pressed="${draft.block===b.k}">
          <span class="dot"></span><span>${b.t}<em>${b.d}</em></span></button>`).join('')}</div></div>
      ${draft.block==='other'||draft.note?`<div class="fld"><label class="lb" for="nt">補充</label>
        <input id="nt" value="${esc(draft.note||'')}" placeholder="一句話就好"></div>`:''}
      <button class="save" id="sv" ${ready?'':'disabled'}>${ready?'記錄':'請選擇回應與卡點'}</button>
      <button class="skip" id="cl">取消</button>
    </div>`;
  $('#dt').onchange=e=>draft.d=e.target.value;
  $('#am').oninput=e=>draft.amt=e.target.value;
  const nt=$('#nt'); if(nt) nt.oninput=e=>draft.note=e.target.value;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{draft.reply=b.dataset.r==='1';keep();drawSheet();});
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
    draft.block=b.dataset.b;
    if(draft.block==='noreply'&&draft.reply===null) draft.reply=false;
    if(draft.block==='ok'&&draft.reply===null) draft.reply=true;
    keep();drawSheet();});
  $('#cl').onclick=closeSheet;
  $('#sv').onclick=async()=>{keep();
    const btn=$('#sv'); btn.disabled=true; btn.textContent='儲存中…';
    const rec={d:draft.d,reply:draft.reply,amt:Number(draft.amt)||0,
      block:draft.block,note:draft.note||'',ts:Date.now()};
    try{ await push(m,rec); logs[m.u+'|'+m.n]=rec; closeSheet(); render(); toast('已記錄 '+m.n); }
    catch(err){ btn.disabled=false; btn.textContent='重試'; toast('沒有存到，請確認網路後重試'); }};
  function keep(){const a=$('#am'),n=$('#nt'),d=$('#dt');
    if(a)draft.amt=a.value; if(n)draft.note=n.value; if(d)draft.d=d.value;}
}

$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
let loading=true;
let proj={};   // 專案二三狀態
function boot(){
  const q=new URLSearchParams(location.search).get('u');
  if(q&&TOKENS[q]){
    const v=TOKENS[q];
    role = v.type==='upline'?{type:'upline',name:v.name}
         : v.type==='leader'?{type:'leader',team:v.team}:{type:'dept'};
    if(role.type==='leader'){tab='self';} if(role.type==='dept'){tab='rank';}
  }
  render();
  Promise.all([load(),loadSeen(),loadProj()]).then(()=>{ loading=false; render();
    if(!online) toast('連不上資料庫，紀錄不會保存'); });
}
boot();
</script>
